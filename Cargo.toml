[package]
name = "dexian_lending_protocol"
version = "0.9.1"
edition = "2021"
resolver = "2"

[dependencies]
scrypto = { version = "1.3.0" }

hex = { version = "0.4.3", default-features = false }
# serde = { version = "1.0.144", default-features = false, optional = true }
# ed25519-dalek = { version = "1.0.1", default-features = false, features = ["u64_backend"]}
ed25519-dalek = { version="2.1.0", default-features = false }

[dev-dependencies]
scrypto-test = { version = "1.3.0" }
dexian_lending_protocol = {path = ".", features=["test"]}

[profile.release]
opt-level = 'z'        # Optimize for size.
lto = true             # Enable Link Time Optimization.
codegen-units = 1      # Reduce number of codegen units to increase optimizations.
panic = 'abort'        # Abort on panic.
strip =  true          # "debuginfo"    # Strip debug info.
overflow-checks = true # Panic in the case of an overflow.

[features]
default = []
test = []

[lib]
crate-type = ["cdylib", "lib"]

[workspace]
# Set the package crate as its own empty workspace, to hide it from any potential ancestor workspace
# Remove this [workspace] section if you intend the package to be part of a Cargo workspace